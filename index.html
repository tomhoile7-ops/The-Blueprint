<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE BLUEPRINT</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f6f8;font-family:system-ui,sans-serif}header{position:sticky;top:0;background:#0b0d10f5;border-bottom:1px solid #29313a;padding:13px;z-index:9}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.small{font-size:11px;color:#9ca7b3}select,button,input,textarea{font:inherit}.week{background:#171b21;color:white;border:1px solid #343d48;border-radius:10px;padding:9px;font-weight:800}nav{display:flex;gap:7px;overflow:auto;margin-top:10px}.tab{white-space:nowrap;border:1px solid #343d48;background:#171b21;color:white;border-radius:99px;padding:8px 11px;font-weight:700}.tab.on{background:white;color:#111}main{max-width:650px;margin:auto;padding:15px 13px 90px}.page{display:none}.page.on{display:block}h1{font-size:24px}.card{background:#15191f;border:1px solid #2b333d;border-radius:16px;padding:14px;margin:11px 0}.head{display:flex;justify-content:space-between;gap:8px}.head h2{font-size:18px;margin:0}.target{font-size:13px;color:#9ca7b3;font-weight:800}.last{background:#10141a;border:1px solid #303945;border-radius:10px;padding:10px;margin:11px 0;font-size:13px;line-height:1.5;color:#d7dce2}.copy{width:100%;margin-top:7px;padding:8px;border:1px solid #45515f;background:#1c232c;color:white;border-radius:8px;font-weight:800}.sh,.sr{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;align-items:center}.sh{font-size:10px;color:#9ca7b3;text-align:center;margin:10px 0 4px}.sr{margin:6px 0}.n{text-align:center;color:#9ca7b3;font-weight:800}input,textarea{width:100%;background:#0d1014;border:1px solid #353e49;color:white;border-radius:9px;padding:10px;font-size:16px}.sr input{text-align:center;padding:10px 3px}textarea{min-height:65px;margin-top:8px}.decisions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.dec{border:1px solid #39434f;background:#10141a;color:white;border-radius:9px;padding:9px 2px;font-weight:700}.dec.sel{background:white;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;color:#9ca7b3;margin-bottom:5px}.wide{grid-column:1/-1}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.toolbtn{border:1px solid #45515f;background:#1c232c;color:#fff;border-radius:10px;padding:11px;font-weight:800}.save{position:fixed;bottom:0;left:0;right:0;background:#0b0d10f5;border-top:1px solid #29313a;padding:10px;text-align:center;color:#bfe3c5;font-size:12px}</style></head>
<body><header><div class="top"><div><div class="brand">THE BLUEPRINT</div><div class="small">12 WEEK PHONE JOURNAL</div></div><select id="week" class="week"></select></div><nav id="nav"></nav></header><main>
<section class="page on" data-page="Dashboard"><h1 id="dt"></h1><div class="card grid"><div class="field"><label>Weight (st/lb)</label><input data-meta="weight"></div><div class="field"><label>Waist (in)</label><input data-meta="waist"></div><div class="field"><label>Sleep</label><input data-meta="sleep"></div><div class="field"><label>Energy</label><input data-meta="energy"></div><div class="field wide"><label>Goal</label><textarea data-meta="goal"></textarea></div><div class="field wide"><label>Notes</label><textarea data-meta="notes"></textarea></div></div>
<div class="tools"><button class="toolbtn" id="backupBtn">Backup Data</button><button class="toolbtn" id="restoreBtn">Restore Data</button></div>
<input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
<div class="small">Backup saves all Blueprint workout history to a file. Keep a copy somewhere safe.</div>
</section><div id="workouts"></div>
<section class="page" data-page="Review"><h1 id="rt"></h1><div class="card grid"><div class="field wide"><label>Average Weight</label><input data-meta="avg"></div><div class="field wide"><label>Nutrition Adherence</label><textarea data-meta="nutrition"></textarea></div><div class="field wide"><label>Best Lift</label><input data-meta="lift"></div><div class="field wide"><label>Biggest Win</label><textarea data-meta="win"></textarea></div><div class="field wide"><label>Focus for Next Week</label><textarea data-meta="focus"></textarea></div></div></section></main><div class="save">✓ Entries save automatically on this device</div>
<script>const W={"Monday \u2013 Push A": [["Bench Press", "4\u00d75\u20138", 4, "weight"], ["Standing Dumbbell Press", "3\u00d76\u20138", 3, "weight"], ["Incline Dumbbell Press", "3\u00d78\u201310", 3, "weight"], ["Plate Lateral Raise", "4\u00d712\u201315", 4, "weight"], ["Cable Pushdown", "3\u00d710\u201312", 3, "weight"], ["Seated DB Overhead Triceps Extension", "3\u00d712\u201315", 3, "weight"]], "Tuesday \u2013 Pull": [["Deadlift", "3\u00d75", 3, "weight"], ["Lat Pulldowns", "4\u00d76\u20138", 4, "weight"], ["Barbell Row", "4\u00d76\u20138", 4, "weight"], ["1-Arm Dumbbell Row", "3\u00d710", 3, "weight"], ["Face Pull", "3\u00d715", 3, "weight"], ["EZ Curl", "3\u00d710", 3, "weight"], ["Hammer Curl", "2\u00d712", 2, "weight"]], "Wednesday \u2013 Legs": [["Back Squat", "4\u00d75\u20138", 4, "weight"], ["Romanian Deadlift", "4\u00d78\u201310", 4, "weight"], ["Bulgarian Split Squat", "3\u00d710", 3, "weight"], ["Walking Lunges", "2\u00d712", 2, "weight"], ["Standing Calf Raise", "4\u00d715", 4, "weight"], ["Hanging Leg Raise", "3\u00d712\u201315", 3, "weight"]], "Thursday \u2013 Push B": [["Incline Bench Press", "4\u00d78\u201310", 4, "weight"], ["Banded Dips", "3\u00d78\u201312", 3, "band"], ["Seated Dumbbell Press", "3\u00d710\u201312", 3, "weight"], ["Cable Fly", "3\u00d712\u201315", 3, "weight"], ["Plate Lateral Raise", "4\u00d715\u201320", 4, "weight"], ["Skull Crushers", "3\u00d710\u201312", 3, "weight"], ["Cable Pushdown", "2\u00d715", 2, "weight"]], "Friday \u2013 Pull B": [["Pull-ups", "4\u00d78\u201312", 4, "weight"], ["Pendlay Row", "3\u00d78\u201310", 3, "weight"], ["Straight-arm Pulldown", "3\u00d712\u201315", 3, "weight"], ["Rear Delt Fly", "3\u00d715\u201320", 3, "weight"], ["EZ Curl", "3\u00d710\u201312", 3, "weight"], ["Incline Curl", "3\u00d712\u201315", 3, "weight"], ["Barbell Shrugs", "3\u00d712", 3, "weight"]]};let cw=1;const safe=s=>s.replace(/[^a-z0-9]/gi,"-").toLowerCase(),K=(...a)=>"blueprint:"+a.join(":"),V=k=>localStorage.getItem(k)||"";
const week=document.getElementById("week");for(let i=1;i<=12;i++)week.innerHTML+=`<option value="${i}">Week ${i}</option>`;
const root=document.getElementById("workouts");for(const [day,exs] of Object.entries(W)){let s=document.createElement("section");s.className="page";s.dataset.page=day;s.innerHTML=`<h1>${day}</h1>`;for(const [name,target,sets,type] of exs){let id=safe(name),rows="";for(let i=1;i<=sets;i++)rows+=`<div class="sr"><div class="n">${i}</div><input data-ex="${id}" data-set="${i}" data-v="w" placeholder="${type==="band"?"band":"kg"}"><input data-ex="${id}" data-set="${i}" data-v="r" inputmode="numeric" placeholder="reps"></div>`;s.innerHTML+=`<div class="card exercise" data-id="${id}" data-type="${type}"><div class="head"><h2>${name}</h2><span class="target">${target}</span></div><div class="last"></div><div class="sh"><span>SET</span><span>${type==="band"?"BAND":"WEIGHT"}</span><span>REPS</span></div>${rows}<div class="decisions"><button class="dec" data-c="increase">↑ Increase</button><button class="dec" data-c="beat">+ Beat reps</button><button class="dec" data-c="same">→ Same</button></div><textarea data-note placeholder="Notes"></textarea></div>`}root.appendChild(s)}
const pages=["Dashboard",...Object.keys(W),"Review"],short={"Monday – Push A":"Mon · Push A","Tuesday – Pull":"Tue · Pull","Wednesday – Legs":"Wed · Legs","Thursday – Push B":"Thu · Push B","Friday – Pull B":"Fri · Pull B"},nav=document.getElementById("nav");pages.forEach((p,i)=>{let b=document.createElement("button");b.className="tab"+(i?"":" on");b.textContent=short[p]||p;b.onclick=()=>{document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.dataset.page===p));document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");scrollTo(0,0)};nav.appendChild(b)});
function prev(ex){for(let w=cw-1;w>=1;w--){let a=[];for(let s=1;s<=6;s++){let x=[V(K(w,ex,s,"w")),V(K(w,ex,s,"r"))];if(x.some(Boolean))a.push([s,...x])}if(a.length)return[w,a,V(K(w,ex,"decision"))]}return null}
function load(){dt.textContent=`Week ${cw} Dashboard`;rt.textContent=`Week ${cw} Review`;document.querySelectorAll("[data-meta]").forEach(e=>{let k=K(cw,"meta",e.dataset.meta);e.value=V(k);e.oninput=()=>localStorage.setItem(k,e.value)});document.querySelectorAll(".exercise").forEach(c=>{let ex=c.dataset.id,p=prev(ex),l=c.querySelector(".last");if(p){let units=c.dataset.type==="band"?"":"kg";l.innerHTML=`<b>Last session · Week ${p[0]}</b><br>`+p[1].map(x=>`${x[1]||"—"}${units} × ${x[2]||"—"}`).join(" | ")+(p[2]?`<br><b>Next:</b> ${p[2]}`:"")+`<button class="copy">Copy last session</button>`;l.querySelector(".copy").onclick=()=>{p[1].forEach(x=>["w","r"].forEach((v,j)=>{let e=c.querySelector(`[data-set="${x[0]}"][data-v="${v}"]`);let value=x[j+1];if(e&&value){e.value=value;localStorage.setItem(K(cw,ex,x[0],v),value)}}))}}else l.innerHTML='<span style="color:#9ca7b3"><i>No previous session yet — this becomes your baseline.</i></span>';c.querySelectorAll("[data-v]").forEach(e=>{let k=K(cw,ex,e.dataset.set,e.dataset.v);e.value=V(k);e.oninput=()=>localStorage.setItem(k,e.value)});let d=V(K(cw,ex,"decision"));c.querySelectorAll(".dec").forEach(b=>{b.classList.toggle("sel",b.dataset.c===d);b.onclick=()=>{c.querySelectorAll(".dec").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");localStorage.setItem(K(cw,ex,"decision"),b.dataset.c)}});let n=c.querySelector("[data-note]"),nk=K(cw,ex,"note");n.value=V(nk);n.oninput=()=>localStorage.setItem(nk,n.value)})}week.onchange=()=>{cw=+week.value;load()};load();
document.getElementById("backupBtn").onclick=()=>{
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("blueprint:"))data[k]=localStorage.getItem(k)}
  const blob=new Blob([JSON.stringify({app:"THE BLUEPRINT",version:1,exported:new Date().toISOString(),data},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="THE_BLUEPRINT_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById("restoreBtn").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=async(e)=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const obj=JSON.parse(await f.text());
    if(!obj.data)throw new Error("Invalid backup");
    if(!confirm("Restore this Blueprint backup? Existing Blueprint entries with the same fields will be replaced."))return;
    Object.entries(obj.data).forEach(([k,v])=>{if(k.startsWith("blueprint:"))localStorage.setItem(k,v)});
    alert("Blueprint data restored."); location.reload();
  }catch(err){alert("That file does not look like a valid Blueprint backup.");}
};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"))}
</script></body></html>
